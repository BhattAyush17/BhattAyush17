name: Streak Health Check

on:
  schedule:
    # Staggered 15m after the generator so the two never start together.
    - cron: "15 */6 * * *"
  workflow_dispatch:

concurrency:
  # Same group as the other asset workflows so runs queue instead of
  # cancelling each other mid-flight (cancel-in-progress was killing self-heals).
  group: github-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the rebase in publish_assets.sh is reliable.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report current streak state
        run: |
          if [ ! -s assets/stats/streak.svg ]; then
            echo "streak.svg missing/empty"
          elif ! grep -q "<svg" assets/stats/streak.svg; then
            echo "streak.svg is not an SVG"
          else
            echo "streak.svg present ($(wc -c < assets/stats/streak.svg) bytes)"
          fi

      # Always refresh, not just when broken — this is the reliable updater.
      # generate_stats.py fetches live data (USE_HOT_CACHE=False) and falls back
      # to the committed cache when the live API is unavailable.
      - name: Refresh streak counter
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          pip install requests
          python scripts/generate_stats.py

      - name: Version the README card images
        run: |
          # GitHub caches README images by URL; a fresh ?v= makes the
          # profile pick up the regenerated cards instead of a stale copy.
          version="$(date -u +%Y%m%d%H%M%S)"
          sed -i -E "s#(assets/stats/(github-cards|commit-hours)\.svg)(\?v=[0-9]+)?#\1?v=${version}#g" README.md
          grep -n "github-cards\|commit-hours" README.md

      - name: Commit refreshed streak
        run: |
          scripts/publish_assets.sh \
            "chore: refresh streak counter" \
            assets/stats/streak.svg \
            assets/stats/github-stats.svg \
            assets/stats/languages.svg \
            assets/stats/github-cards.svg \
            assets/stats/commit-hours.svg \
            assets/stats/data.json \
            assets/streak/streak.svg \
            assets/cache/bhattayush17-github.json \
            README.md
