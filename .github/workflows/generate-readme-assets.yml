name: Generate README Assets

on:
  schedule:
    - cron: "0 */6 * * *"          # Every 6 hours
  workflow_dispatch:                # Manual trigger
  push:
    branches:
      - main

# Prevent overlapping runs
concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate stats assets
        run: python scripts/generate_stats.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BhattAyush17
          outputs: assets/snake/github-contribution-grid-snake-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest branch
        run: git pull --rebase origin main || true

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update README analytics assets [skip ci]"
          file_pattern: "assets/**/*.svg"
