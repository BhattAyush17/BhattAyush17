name: Generate README Assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  # Queue with the other asset workflows instead of cancelling them.
  group: github-analytics
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the rebase in publish_assets.sh is reliable.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # scripts/generate_stats.py now only needs requests (stdlib for the rest)
        run: |
          pip install requests

      - name: Run generator
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          python scripts/generate_stats.py

      - name: Version the README card images
        run: |
          # GitHub caches README images by URL; a fresh ?v= makes the
          # profile pick up the regenerated cards instead of a stale copy.
          version="$(date -u +%Y%m%d%H%M%S)"
          sed -i -E "s#(assets/stats/(github-cards|commit-hours)\.svg)(\?v=[0-9]+)?#\1?v=${version}#g" README.md
          grep -n "github-cards\|commit-hours" README.md

      - name: Commit generated assets
        run: |
          scripts/publish_assets.sh \
            "chore: update README analytics assets" \
            assets/stats assets/streak assets/cache/bhattayush17-github.json README.md
