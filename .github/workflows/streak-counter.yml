name: Update Commit Streak

on:
  push:                 # Run on every push to the repository
    branches:
      - main            # or your default branch
  schedule:
    - cron: '0 0 * * *' # Also run daily at midnight UTC
  workflow_dispatch:    # Manual trigger

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install PyGithub

      - name: Calculate and update streak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: BhattAyush17/BhattAyush17
          README_PATH: README.md
          BRANCH: main
        run: python .github/workflows/streak_counter.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.README_PATH }}
          git diff --cached --quiet || git commit -m "Update daily commit streak in README"
          git push
