<svg xmlns="http://www.w3.org/2000/svg" width="450" height="195" viewBox="0 0 450 195">
  <style>
    .title { font: bold 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; }
    .lang-name { font: bold 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .lang-pct { font: 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
  </style>
  <rect x="0.5" y="0.5" rx="6" ry="6" width="449" height="194" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="25" y="35" class="title">Top Languages</text>
  
  <!-- Progress Bar -->
  <clipPath id="bar-clip">
    <rect x="25" y="55" width="400" height="10" rx="5" />
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="25.00" y="55" width="210.53" height="10" fill="#3572A5" />
    <rect x="235.53" y="55" width="42.11" height="10" fill="#f1e05a" />
    <rect x="277.63" y="55" width="42.11" height="10" fill="#DA5B0B" />
    <rect x="319.74" y="55" width="42.11" height="10" fill="#3178c6" />
    <rect x="361.84" y="55" width="21.05" height="10" fill="#663399" />
    <rect x="382.89" y="55" width="21.05" height="10" fill="#f34b7d" />
    <rect x="403.95" y="55" width="21.05" height="10" fill="#8b949e" />
  </g>
  
  <!-- Legend Grid -->
  <g transform="translate(25, 85)">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="8" r="5" fill="#3572A5" />
      <text x="18" y="12" class="lang-name">Python</text>
      <text x="110" y="12" class="lang-pct">52.6%</text>
    </g>
    <g transform="translate(0, 24)">
      <circle cx="5" cy="8" r="5" fill="#f1e05a" />
      <text x="18" y="12" class="lang-name">JavaScript</text>
      <text x="110" y="12" class="lang-pct">10.5%</text>
    </g>
    <g transform="translate(0, 48)">
      <circle cx="5" cy="8" r="5" fill="#DA5B0B" />
      <text x="18" y="12" class="lang-name">Jupyter Notebook</text>
      <text x="110" y="12" class="lang-pct">10.5%</text>
    </g>
    <g transform="translate(200, 0)">
      <circle cx="5" cy="8" r="5" fill="#3178c6" />
      <text x="18" y="12" class="lang-name">TypeScript</text>
      <text x="110" y="12" class="lang-pct">10.5%</text>
    </g>
    <g transform="translate(200, 24)">
      <circle cx="5" cy="8" r="5" fill="#663399" />
      <text x="18" y="12" class="lang-name">CSS</text>
      <text x="110" y="12" class="lang-pct">5.3%</text>
