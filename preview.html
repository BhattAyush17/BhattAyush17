<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README.md Live Premium Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 18, 18, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --accent: #ffffff;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.03) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
    }

    header {
      width: 100%;
      max-width: 900px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 0 24px 60px 24px;
      box-sizing: border-box;
    }

    .preview-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* Markdown styling overrides */
    .markdown-body img {
      max-width: 100%;
      border-radius: 8px;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: #ffffff;
      font-weight: 700;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 12px;
      text-align: left;
    }

    .markdown-body tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .markdown-body a {
      color: #60a5fa;
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ <span>Monochrome README Preview</span></h1>
    <div class="badge">Local Server (Port 8000)</div>
  </header>

  <main>
    <div class="preview-container markdown-body" id="preview">
      Loading preview...
    </div>
  </main>

  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(text => {
        document.getElementById('preview').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('preview').innerHTML = '<span style="color:#ef4444;">Error loading README.md file: ' + err.message + '</span>';
      });
  </script>
</body>
</html>
